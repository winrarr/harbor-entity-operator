name: Docs

on:
  pull_request:
    branches:
      - main
      - 'release/v*'
  push:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect docs-relevant changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            api_reference:
              - 'api/**'
              - 'docs/reference/api.md'
              - 'hack/crd-ref-docs.yaml'
              - 'hack/make-config.mk'
              - 'Makefile'
            docs_site:
              - 'api/**'
              - 'docs/**'
              - 'hack/crd-ref-docs.yaml'
              - 'hack/make-config.mk'
              - 'Makefile'
              - 'zensical.toml'
              - '.github/workflows/docs.yaml'

      - name: Set up Go
        if: steps.changes.outputs.api_reference == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate API reference
        if: steps.changes.outputs.api_reference == 'true'
        run: make generate-api-reference

      - name: Build docs site
        if: steps.changes.outputs.docs_site == 'true'
        run: make build-docs-site

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.docs_site == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.docs_site == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.docs_site == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
