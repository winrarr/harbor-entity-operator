name: Release Branch Patch Train

on:
  push:
    branches:
      - 'release/v*'
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      release_branch:
        description: Optional release branch to process, e.g. release/v0.5
        required: false
        type: string
      dry_run:
        description: Evaluate eligibility without creating tags
        required: false
        default: false
        type: boolean
      emergency_override:
        description: Allow deliberate security or emergency work on an unsupported release line
        required: false
        default: false
        type: boolean
      emergency_reason:
        description: Brief reason required when emergency_override is enabled
        required: false
        type: string

concurrency:
  group: release-branch-patch-train
  cancel-in-progress: false

jobs:
  patch-train:
    runs-on: ubuntu-latest
    environment: ${{ inputs.emergency_override && 'release-emergency' || 'release-routine' }}
    permissions:
      contents: write
      checks: read
      pull-requests: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create patch releases when runtime dependency files changed on release branches
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.event_name == 'push' && github.ref_name || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          EMERGENCY_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_override && 'true' || 'false' }}
          EMERGENCY_REASON: ${{ inputs.emergency_reason || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hack/release_branch_patch_train.py
