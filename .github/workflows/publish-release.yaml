name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish or recover.
        required: true
        type: string
      dry_run:
        description: Validate and build without publishing artifacts or a GitHub Release.
        required: false
        default: false
        type: boolean
      emergency_override:
        description: Allow deliberate security or emergency work on an unsupported release line
        required: false
        default: false
        type: boolean
      emergency_reason:
        description: Brief reason required when emergency_override is enabled
        required: false
        type: string

permissions:
  checks: read
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

concurrency:
  group: publish-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.emergency_override && 'release-emergency' || 'release-routine' }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag_name) }}
          fetch-depth: 0

      - name: Fetch release branches and tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          EVENT_NAME: ${{ github.event_name }}
          EMERGENCY_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_override && 'true' || 'false' }}
          EMERGENCY_REASON: ${{ inputs.emergency_reason || '' }}
        run: |
          set -euo pipefail

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          chart_yaml='charts/harbor-entity-operator/Chart.yaml'
          chart_version="$(awk '$1 == "version:" { value=$2; gsub(/^"/, "", value); gsub(/"$/, "", value); print value; exit }' "$chart_yaml")"
          app_version="$(awk '$1 == "appVersion:" { value=$2; gsub(/^"/, "", value); gsub(/"$/, "", value); print value; exit }' "$chart_yaml")"
          release_sha="$(git rev-parse HEAD)"

          if [[ ! "$chart_version" =~ $semver_re ]]; then
            echo "Chart.yaml version must use X.Y.Z or X.Y.Z-rc.N, got: $chart_version" >&2
            exit 1
          fi

          if [[ ! "$app_version" =~ $semver_re ]]; then
            echo "Chart.yaml appVersion must use X.Y.Z or X.Y.Z-rc.N, got: $app_version" >&2
            exit 1
          fi

          case "$RELEASE_TAG" in
            v*)
              operator_version="${RELEASE_TAG#v}"
              if [[ ! "$operator_version" =~ $semver_re ]]; then
                echo "Invalid operator release tag: $RELEASE_TAG" >&2
                exit 1
              fi
              if [[ "$app_version" != "$operator_version" ]]; then
                echo "Chart.yaml appVersion $app_version does not match operator tag $RELEASE_TAG" >&2
                exit 1
              fi
              if [[ "$operator_version" == *-rc.* && "$chart_version" != *-rc.* ]]; then
                echo "A release candidate operator must use a release candidate chart version" >&2
                exit 1
              fi
              if [[ "$operator_version" != *-rc.* && "$chart_version" == *-rc.* ]]; then
                echo "A stable operator must use a stable chart version" >&2
                exit 1
              fi
              release_kind=operator
              ;;
            chart-v*)
              chart_tag_version="${RELEASE_TAG#chart-v}"
              if [[ ! "$chart_tag_version" =~ $semver_re ]]; then
                echo "Invalid chart release tag: $RELEASE_TAG" >&2
                exit 1
              fi
              if [[ "$chart_version" != "$chart_tag_version" ]]; then
                echo "Chart.yaml version $chart_version does not match chart tag $RELEASE_TAG" >&2
                exit 1
              fi
              if [[ "$chart_version" != *-rc.* && "$app_version" == *-rc.* ]]; then
                echo "A stable chart must not reference a release candidate operator" >&2
                exit 1
              fi
              operator_version="$app_version"
              release_kind=chart
              ;;
            *)
              echo "Release tag must start with v or chart-v: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          if ! python3 hack/release_policy.py check-version "$operator_version"; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$EMERGENCY_OVERRIDE" != "true" || -z "$EMERGENCY_REASON" ]]; then
              echo "Unsupported release lines require a manual emergency dispatch with a reason and approval through the release-emergency environment." >&2
              exit 1
            fi
            echo "Emergency override authorized for release version $operator_version with a documented reason"
          fi

          release_line="$(printf '%s' "${operator_version%%-rc.*}" | cut -d. -f1-2)"
          branch_ref="refs/remotes/origin/release/v${release_line}"
          if ! git show-ref --verify --quiet "$branch_ref"; then
            echo "Release branch release/v${release_line} does not exist" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" "$branch_ref"; then
            echo "$RELEASE_TAG does not point to a commit contained in release/v${release_line}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            prerelease=true
          fi

          {
            echo "release_kind=$release_kind"
            echo "release_sha=$release_sha"
            echo "operator_version=$operator_version"
            echo "chart_version=$chart_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Verify required checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hack/required_checks.py "${{ steps.metadata.outputs.release_sha }}" --wait

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Helm registry
        if: env.DRY_RUN != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Resolve operator image tags
        id: image_tags
        if: steps.metadata.outputs.release_kind == 'operator'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          OPERATOR_VERSION: ${{ steps.metadata.outputs.operator_version }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${OPERATOR_VERSION}"
            echo "${IMAGE}:${RELEASE_TAG}"
            if [ "$PRERELEASE" != "true" ]; then
              echo "${IMAGE}:$(printf '%s' "$OPERATOR_VERSION" | cut -d. -f1-2)"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push operator image
        if: steps.metadata.outputs.release_kind == 'operator'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DRY_RUN != 'true' }}
          load: ${{ env.DRY_RUN == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: Verify operator image exists
        if: env.DRY_RUN != 'true'
        env:
          OPERATOR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          OPERATOR_VERSION: ${{ steps.metadata.outputs.operator_version }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if docker manifest inspect "${OPERATOR_IMAGE}:${OPERATOR_VERSION}" >/dev/null 2>&1; then
              exit 0
            fi

            echo "Waiting for operator image ${OPERATOR_IMAGE}:${OPERATOR_VERSION} (${attempt}/30)"
            sleep 15
          done

          echo "Operator image ${OPERATOR_IMAGE}:${OPERATOR_VERSION} was not found in GHCR" >&2
          exit 1

      - name: Check whether chart package already exists
        id: chart_exists
        if: env.DRY_RUN != 'true'
        env:
          CHART_REPOSITORY: ${{ env.CHART_REPOSITORY }}
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
          OPERATOR_VERSION: ${{ steps.metadata.outputs.operator_version }}
        run: |
          set -euo pipefail

          existing_chart="$(helm show chart "oci://${CHART_REPOSITORY}/harbor-entity-operator" --version "$CHART_VERSION" 2>/dev/null || true)"
          if [ -n "$existing_chart" ]; then
            existing_app_version="$(awk '$1 == "appVersion:" { value=$2; gsub(/^"/, "", value); gsub(/"$/, "", value); print value; exit }' <<<"$existing_chart")"
            if [ "$existing_app_version" != "$OPERATOR_VERSION" ]; then
              echo "Existing chart $CHART_VERSION has appVersion $existing_app_version, expected $OPERATOR_VERSION" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
          OPERATOR_VERSION: ${{ steps.metadata.outputs.operator_version }}
        run: |
          helm package charts/harbor-entity-operator \
            --version "$CHART_VERSION" \
            --app-version "$OPERATOR_VERSION" \
            --destination dist

      - name: Push chart
        if: env.DRY_RUN != 'true' && steps.chart_exists.outputs.exists != 'true'
        env:
          CHART_REPOSITORY: ${{ env.CHART_REPOSITORY }}
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
        run: helm push "dist/harbor-entity-operator-${CHART_VERSION}.tgz" "oci://${CHART_REPOSITORY}"

      - name: Resolve release notes start tag
        id: notes
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_KIND: ${{ steps.metadata.outputs.release_kind }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail

          previous_in_series() {
            local target="$1"
            local pattern="$2"
            local regex="$3"

            {
              git tag --list "$pattern" | grep -E "$regex" || true
              echo "$target"
            } | sort -V | awk -v target="$target" '
              $0 == target { print prev; found = 1; exit }
              { prev = $0 }
              END {
                if (!found && prev != target) {
                  print prev
                }
              }
            '
          }

          if [ "$RELEASE_KIND" = "operator" ]; then
            if [ "$PRERELEASE" = "true" ]; then
              version="${RELEASE_TAG#v}"
              base_version="${version%%-rc.*}"
              release_line="$(printf '%s' "$base_version" | cut -d. -f1-2)"
              previous_tag="$(previous_in_series "v${base_version}" "v${release_line}.*" "^v${release_line}\\.[0-9]+$")"
              if [ -z "$previous_tag" ]; then
                previous_tag="$(previous_in_series "v${base_version}" 'v*' '^v[0-9]+\\.[0-9]+\\.[0-9]+$')"
              fi
            else
              previous_tag="$(previous_in_series "$RELEASE_TAG" 'v*' '^v[0-9]+\\.[0-9]+\\.[0-9]+$')"
            fi
          else
            if [ "$PRERELEASE" = "true" ]; then
              version="${RELEASE_TAG#chart-v}"
              base_version="${version%%-rc.*}"
              release_line="$(printf '%s' "$base_version" | cut -d. -f1-2)"
              previous_tag="$(previous_in_series "chart-v${base_version}" "chart-v${release_line}.*" "^chart-v${release_line}\\.[0-9]+$")"
              if [ -z "$previous_tag" ]; then
                previous_tag="$(previous_in_series "chart-v${base_version}" 'chart-v*' '^chart-v[0-9]+\\.[0-9]+\\.[0-9]+$')"
              fi
            else
              previous_tag="$(previous_in_series "$RELEASE_TAG" 'chart-v*' '^chart-v[0-9]+\\.[0-9]+\\.[0-9]+$')"
            fi
          fi

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Decide latest release flag
        id: latest
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_KIND: ${{ steps.metadata.outputs.release_kind }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          if [ "$RELEASE_KIND" != "operator" ] || [ "$PRERELEASE" = "true" ]; then
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          highest_tag="$({ git tag --list 'v*' | grep -E '^v[0-9]+\\.[0-9]+\\.[0-9]+$' || true; } | sort -V | tail -n1)"
          if [ "$RELEASE_TAG" = "$highest_tag" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report dry-run result
        if: env.DRY_RUN == 'true'
        run: echo "Dry run passed for ${RELEASE_TAG}; no image, chart, or GitHub Release was published."

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          previous_tag: ${{ steps.notes.outputs.previous_tag }}
          generate_release_notes: true
          make_latest: ${{ steps.latest.outputs.make_latest }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          files: |
            dist/harbor-entity-operator-${{ steps.metadata.outputs.chart_version }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
