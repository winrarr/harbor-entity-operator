# Optional pattern. Keep this file outside .github/workflows until the
# repository has deliberately configured release branches, publication, branch
# protection, and credentials. The companion publish workflow is
# .github/workflow-patterns/publish-release.yml.
name: Release Branch Patch Train

on:
  push:
    branches:
      - 'release/v*'
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      release_branch:
        description: Optional release branch to process, for example release/v0.1
        required: false
        type: string
      dry_run:
        description: Evaluate eligibility without creating tags
        required: false
        default: false
        type: boolean

concurrency:
  group: release-branch-patch-train
  cancel-in-progress: false

jobs:
  patch-train:
    if: vars.RELEASE_PATCH_TRAIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      checks: read
      pull-requests: read
    steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        permission-contents: write
        permission-checks: read
        permission-pull-requests: read

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Run release branch patch train
      env:
        RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.event_name == 'push' && github.ref_name || '' }}
        DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REQUIRED_CHECKS: >-
          ${{ vars.RELEASE_REQUIRED_CHECKS || 'Build documentation,Lint,Generated assets,Unit and contract tests,Kind cluster and installation,Source vulnerability scan,Image vulnerability scan and SBOM' }}
        CHART_PATH: charts/operator-foundry
        PUBLISH_WORKFLOW: publish-release.yml
      run: python3 hack/release_branch_patch_train.py
