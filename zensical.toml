[project]
site_name = "harbor-entity-operator"
site_description = "Kubernetes operator for managing Harbor through custom resources."
site_url = "https://winrarr.github.io/harbor-entity-operator/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/winrarr/harbor-entity-operator"
repo_name = "winrarr/harbor-entity-operator"
edit_uri = "edit/main/docs/"
strict = true
extra_javascript = [
  "https://unpkg.com/mermaid@11.16.0/dist/mermaid.min.js",
  "javascripts/mermaid.js",
]
nav = [
