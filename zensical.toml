    { "Product Direction" = "product.md" },
    { "User Stories" = "user-stories.md" },
    { "Research" = "research/index.md" },
    { "Harbor API Coverage" = "research/harbor-api-coverage.md" },
    { "Engineering References" = "research/reference-operators.md" },
    { "Backlog" = "backlog.md" },
    { "Technical Debt" = "tech-debt.md" },
