    ] },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "Resource Index" = "reference/resources.md" },
    { "Operator Configuration" = "reference/operator-configuration.md" },
    { "Common Spec Fields" = "reference/common-spec-fields.md" },
    { "Status and Conditions" = "reference/status-and-conditions.md" },
    { "Resource Guides" = [
      { "Overview" = "crds/index.md" },
      { "Connections" = [
        { "HarborConnection" = "crds/harbor-connection.md" },
        { "ClusterHarborConnection" = "crds/cluster-harbor-connection.md" },
      ] },
      { "Identity and Access" = [
        { "User" = "crds/user.md" },
        { "UserGroupClaim" = "crds/usergroup.md" },
        { "HarborUserGroup" = "crds/harbor-user-group.md" },
        { "HarborRole" = "crds/harbor-role.md" },
        { "Member" = "crds/member.md" },
        { "Robot" = "crds/robot.md" },
