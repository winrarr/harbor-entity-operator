              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreheatPolicySpec defines project-level preheat behavior.
            properties:
              creationPolicy:
                description: CreationPolicy controls whether the policy is created
                  or adopted.
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens when the Kubernetes object is deleted.
                  Delete removes the corresponding Harbor resource before removing the finalizer.
                  Orphan skips Harbor-side deletion and removes the finalizer so the
                  Kubernetes object can be deleted while leaving the Harbor resource in place.
                  Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: Description describes the policy.
                type: string
              driftDetectionInterval:
                description: |-
                  DriftDetectionInterval is the interval at which the operator checks for drift.
                  When omitted, the operator's default drift detection interval is used.
                  An explicit value of 0 disables periodic drift detection.
                type: string
              enabled:
                description: Enabled controls whether Harbor applies this policy.
                type: boolean
              extraAttrs:
                description: ExtraAttrs is the JSON-encoded provider-specific configuration.
                type: string
              filters:
