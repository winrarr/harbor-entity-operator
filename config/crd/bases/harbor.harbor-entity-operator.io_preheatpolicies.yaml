                type: array
              harborPreheatPolicyID:
                description: HarborPreheatPolicyID is the Harbor policy identifier.
                type: integer
              harborProjectID:
                description: HarborProjectID is the Harbor project identifier used
                  by this policy.
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              resolvedHarborConnection:
                description: |-
                  ResolvedHarborConnection is the exact connection identity used for Harbor
