---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: projects.harbor.harbor-entity-operator.io
spec:
  group: harbor.harbor-entity-operator.io
  names:
    categories:
    - harbor
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.public
      name: Public
      type: boolean
    - jsonPath: .spec.registryRef.name
      name: Registry
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is the Schema for the projects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProjectSpec defines the desired state of Project.
            properties:
              creationPolicy:
                description: |-
                  CreationPolicy controls whether the operator creates or adopts the Harbor project.
                  When omitted, the operator's default creation policy is used.
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              cveAllowlist:
                description: |-
                  CVEAllowlist configures the project's CVE allowlist. Omit it to leave the
                  existing allowlist unmanaged; provide an empty items list to clear it.
                properties:
                  expiresAt:
                    description: |-
                      ExpiresAt is the optional expiration time as seconds since the Unix epoch.
                      Omit it for a non-expiring allowlist.
                    format: int64
                    minimum: 0
                    type: integer
                  items:
                    description: Items is the complete desired list of CVE identifiers.
                    items:
                      description: CVEAllowlistItem defines a single CVE allowlist
                        entry.
                      properties:
                        cveID:
                          description: CveID is the CVE identifier, such as CVE-2024-12345.
                          minLength: 1
                          type: string
                      required:
                      - cveID
                      type: object
                    type: array
                required:
                - items
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens when the Kubernetes object is deleted.
                  Delete removes the corresponding Harbor resource before removing the finalizer.
                  Orphan skips Harbor-side deletion and removes the finalizer so the
                  Kubernetes object can be deleted while leaving the Harbor resource in place.
                  Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              driftDetectionInterval:
                description: |-
                  DriftDetectionInterval is the interval at which the operator checks for drift.
                  When omitted, the operator's default drift detection interval is used.
                  An explicit value of 0 disables periodic drift detection.
                type: string
              harborConnectionRef:
                description: |-
                  HarborConnectionRef references the Harbor connection object to use.
                  When the operator is started with --harbor-connection, this field may be omitted.
                properties:
                  kind:
                    default: HarborConnection
                    description: |-
                      Kind selects the Harbor connection object kind.
                      Defaults to HarborConnection.
                    enum:
                    - HarborConnection
                    - ClusterHarborConnection
                    type: string
                  name:
                    description: Name of the referenced Harbor connection object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              metadata:
                description: Metadata holds additional configuration for the Harbor
                  project.
                properties:
                  auto_sbom_generation:
                    description: AutoSBOMGeneration generates SBOMs automatically
                      when subject artifacts are pushed.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  auto_scan:
                    description: AutoScan scans images automatically when they are
                      pushed.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  enable_content_trust:
                    description: EnableContentTrust blocks pulling unsigned images
                      when enabled.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  enable_content_trust_cosign:
                    description: EnableContentTrustCosign blocks pulling images without
                      a cosign signature when enabled.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  max_upstream_conn:
                    description: |-
                      MaxUpstreamConn is the maximum number of upstream connections per artifact.
                      Use -1 for no limit.
                    pattern: ^(-1|[0-9]+)$
                    type: string
                  prevent_vul:
                    description: PreventVul blocks vulnerable images from running
                      when enabled.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  proxy_cache_filter_kind:
                    description: ProxyCacheFilterKind selects how ProxyCacheFilterPattern
                      is matched.
                    enum:
                    - doublestar
                    - regex
                    type: string
                  proxy_cache_filter_pattern:
                    description: |-
                      ProxyCacheFilterPattern limits which upstream repositories are proxied.
                      Set an explicit empty value to allow all repositories.
                    type: string
                  proxy_cache_local_on_not_found:
                    description: ProxyCacheLocalOnNotFound serves a cached image when
                      it has been removed upstream.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  proxy_referrer_api:
                    description: ProxyReferrerAPI enables proxying OCI 1.1 referrer
                      API requests upstream.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  proxy_speed_kb:
                    description: ProxySpeedKB limits proxy-cache bandwidth in kilobits
                      per second.
                    type: string
                  retention_id:
                    description: RetentionID is the Harbor ID of the project's tag
                      retention policy.
                    type: string
                  reuse_sys_cve_allowlist:
                    description: ReuseSysCVEAllowlist makes the project use the system-wide
                      CVE allowlist.
                    enum:
                    - "true"
                    - "false"
                    type: string
                  severity:
                    description: Severity is the minimum severity threshold for blocking
                      vulnerable images.
                    enum:
                    - none
                    - low
                    - medium
                    - high
                    - critical
                    type: string
                type: object
              owner:
                description: Owner is an optional field for the project owner.
                type: string
              public:
                description: Public indicates whether the project is public.
                type: boolean
              reconcileNonce:
                description: ReconcileNonce forces an immediate reconcile when updated.
                type: string
              registryRef:
                description: RegistryRef references the Registry to use for proxy
                  cache projects.
                properties:
                  name:
                    description: Name of the Registry resource.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: Namespace of the Registry resource. Defaults to the
                      referencing resource namespace.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
            required:
            - public
            type: object
            x-kubernetes-validations:
            - message: registryRef is immutable
              rule: '!has(oldSelf.registryRef) ? !has(self.registryRef) : has(self.registryRef)
                && self.registryRef == oldSelf.registryRef'
            - message: driftDetectionInterval must not be negative
              rule: '!has(self.driftDetectionInterval) || !self.driftDetectionInterval.startsWith(''-'')'
          status:
            description: ProjectStatus defines the observed state of Project.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              harborProjectID:
                description: HarborProjectID is the ID of the project in Harbor.
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              resolvedHarborConnection:
                description: |-
                  ResolvedHarborConnection is the exact connection identity used for Harbor
                  operations. Once set, changing the effective connection is refused.
                properties:
                  kind:
                    description: Kind is either HarborConnection or ClusterHarborConnection.
                    type: string
                  name:
                    description: Name is the name of the connection object.
                    type: string
                  namespace:
                    description: Namespace is set for a namespaced HarborConnection.
                    type: string
                  uid:
                    description: UID is the Kubernetes UID of the connection object.
                    type: string
                required:
                - kind
                - name
                - uid
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
