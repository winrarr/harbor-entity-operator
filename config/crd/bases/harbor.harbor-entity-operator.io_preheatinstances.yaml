---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: preheatinstances.harbor.harbor-entity-operator.io
spec:
  group: harbor.harbor-entity-operator.io
  names:
    categories:
    - harbor
    kind: PreheatInstance
    listKind: PreheatInstanceList
    plural: preheatinstances
    singular: preheatinstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vendor
      name: Vendor
      type: string
    - jsonPath: .status.harborInstanceID
      name: HarborID
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreheatInstance manages a Harbor-global preheat provider instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreheatInstanceSpec defines a Harbor-global P2P preheat provider
              instance.
            properties:
              authInfoSecretRef:
                description: |-
                  AuthInfoSecretRef references a Secret whose data entries are sent as provider credentials.
                  Cluster-scoped instances must set the Secret namespace explicitly.
                properties:
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace of the Secret. When omitted, the controller uses the namespace
                      of the referencing namespaced resource.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              authMode:
                default: NONE
                description: AuthMode is the authentication mode understood by the
                  selected provider.
                minLength: 1
                type: string
              creationPolicy:
                description: CreationPolicy controls whether the instance is created
                  or adopted.
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              default:
                description: Default marks this as Harbor's default preheat instance.
                type: boolean
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens when the Kubernetes object is deleted.
                  Delete removes the corresponding Harbor resource before removing the finalizer.
                  Orphan skips Harbor-side deletion and removes the finalizer so the
                  Kubernetes object can be deleted while leaving the Harbor resource in place.
                  Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: Description describes the preheat provider.
                type: string
              driftDetectionInterval:
                description: |-
                  DriftDetectionInterval is the interval at which the operator checks for drift.
                  When omitted, the operator's default drift detection interval is used.
                  An explicit value of 0 disables periodic drift detection.
                type: string
              enabled:
                description: Enabled controls whether Harbor uses this instance.
                type: boolean
              endpoint:
                description: |-
                  Endpoint is the provider service endpoint.
                  It must be an absolute HTTP or HTTPS URL without query or fragment components.
                format: uri
                pattern: ^https?://[^/?#]+(/[^?#]*)?$
                type: string
              harborConnectionRef:
                description: |-
                  HarborConnectionRef references the Harbor connection object to use.
                  When the operator is started with --harbor-connection, this field may be omitted.
                properties:
                  kind:
                    default: HarborConnection
                    description: |-
                      Kind selects the Harbor connection object kind.
                      Defaults to HarborConnection.
                    enum:
                    - HarborConnection
                    - ClusterHarborConnection
                    type: string
                  name:
                    description: Name of the referenced Harbor connection object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              insecure:
                description: Insecure allows TLS connections to the provider without
                  certificate verification.
                type: boolean
              reconcileNonce:
                description: ReconcileNonce forces an immediate reconcile when updated.
                type: string
              vendor:
                description: Vendor selects the Harbor preheat driver.
                minLength: 1
                type: string
            required:
            - authMode
            - enabled
            - endpoint
            - vendor
            type: object
            x-kubernetes-validations:
            - message: cluster-scoped PreheatInstance requires a ClusterHarborConnection
                reference
              rule: '!has(self.harborConnectionRef) || self.harborConnectionRef.kind
                == ''ClusterHarborConnection'''
            - message: authInfoSecretRef is required when authMode is not NONE
              rule: self.authMode == 'NONE' || has(self.authInfoSecretRef)
            - message: authInfoSecretRef.namespace is required for a cluster-scoped
                PreheatInstance
              rule: '!has(self.authInfoSecretRef) || size(self.authInfoSecretRef.namespace)
                > 0'
            - message: driftDetectionInterval must not be negative
              rule: '!has(self.driftDetectionInterval) || !self.driftDetectionInterval.startsWith(''-'')'
          status:
            description: PreheatInstanceStatus records the Harbor identity of the
              provider instance.
            properties:
              authInfoHash:
                description: AuthInfoHash fingerprints the referenced Secret without
                  exposing its data.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              harborInstanceID:
                description: HarborInstanceID is the Harbor instance identifier.
                type: integer
              harborStatus:
                description: HarborStatus is the latest health status reported by
                  Harbor.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              resolvedHarborConnection:
                description: |-
                  ResolvedHarborConnection is the exact connection identity used for Harbor
                  operations. Once set, changing the effective connection is refused.
                properties:
                  kind:
                    description: Kind is either HarborConnection or ClusterHarborConnection.
                    type: string
                  name:
                    description: Name is the name of the connection object.
                    type: string
                  namespace:
                    description: Namespace is set for a namespaced HarborConnection.
                    type: string
                  uid:
                    description: UID is the Kubernetes UID of the connection object.
                    type: string
                required:
                - kind
                - name
                - uid
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
