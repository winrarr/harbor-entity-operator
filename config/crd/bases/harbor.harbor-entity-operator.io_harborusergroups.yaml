              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HarborUserGroupSpec defines a Harbor-global user group.
            properties:
              creationPolicy:
                description: CreationPolicy controls whether the group is created
                  or adopted.
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls what happens when the Kubernetes object is deleted.
                  Delete removes the corresponding Harbor resource before removing the finalizer.
                  Orphan skips Harbor-side deletion and removes the finalizer so the
                  Kubernetes object can be deleted while leaving the Harbor resource in place.
                  Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              driftDetectionInterval:
                description: |-
                  DriftDetectionInterval is the interval at which the operator checks for drift.
                  When omitted, the operator's default drift detection interval is used.
                  An explicit value of 0 disables periodic drift detection.
                type: string
              groupType:
                description: |-
                  GroupType is 1 for LDAP, 2 for HTTP, and 3 for OIDC groups. Harbor does not
                  change this field through its update endpoint, so it is immutable.
                enum:
                - 1
                - 2
                - 3
                type: integer
